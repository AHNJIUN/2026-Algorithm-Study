name: Auto Classify Programmers Problems

on:
  push:
    branches: [main]
    paths: ['Programmers/**']

permissions:
  contents: write

concurrency:
  group: classify-programmers
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run classification script
        run: |
          python - << 'EOF'
          import os, re, shutil

          BASE = 'Programmers'
          LEVEL = re.compile(r'^\d+$|^unrated$', re.IGNORECASE)
          CATEGORY = re.compile(r'코딩테스트\s*연습\s*>\s*([^>\n]+)')

          def sanitize(name):
              return name.strip().replace('/', '-').replace('\\', '-')

          if not os.path.isdir(BASE):
              print(f'{BASE} 폴더가 없습니다.'); raise SystemExit(0)

          moved = 0
          for member in os.listdir(BASE):
              member_path = os.path.join(BASE, member)
              if not os.path.isdir(member_path):
                  continue
              # 이름 대신 레벨 폴더가 바로 나오면 템플릿 미설정 → 경고만
              if LEVEL.match(member):
                  print(f'경고: {member_path} 는 이름 폴더가 아닙니다. '
                        f'해당 팀원의 백준허브 저장 경로 템플릿을 확인하세요.')
                  continue

              for level in os.listdir(member_path):
                  level_path = os.path.join(member_path, level)
                  if not os.path.isdir(level_path) or not LEVEL.match(level):
                      continue   # 이미 분류된 유형 폴더는 스킵

                  for problem in os.listdir(level_path):
                      problem_path = os.path.join(level_path, problem)
                      if not os.path.isdir(problem_path):
                          continue

                      category = 'Unclassified'
                      readme = os.path.join(problem_path, 'README.md')
                      if os.path.exists(readme):
                          with open(readme, encoding='utf-8') as f:
                              m = CATEGORY.search(f.read())
                          if m:
                              category = sanitize(m.group(1))

                      dest = os.path.join(member_path, category, problem)
                      os.makedirs(os.path.dirname(dest), exist_ok=True)
                      if os.path.exists(dest):
                          shutil.rmtree(dest)
                      print(f'이동: {problem_path} -> {dest}')
                      shutil.move(problem_path, dest)
                      moved += 1

                  if os.path.isdir(level_path) and not os.listdir(level_path):
                      os.rmdir(level_path)

          print(f'총 {moved}개 문제 분류 완료')
          EOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: 프로그래머스 문제 자동 분류 완료 [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "변경 사항이 없습니다."
          fi
